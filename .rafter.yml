# Rafter suppressions - each entry requires a justification, not just a rule id.
suppressions:
  - rule: R-EFEEF
    file: lib/adb.mjs
    line: 30
    reason: >
      False positive (Unsafe Regular Expression / ReDoS) on
      /^\d{1,3}(\.\d{1,3}){3}:\d+$/. No catastrophic backtracking is
      possible: the inner quantifier is bounded ({1,3}) and the group
      repeats an exact literal count ({3}), not +/*, so there is no
      unbounded nesting for the engine to explore. Verified empirically -
      100k+ char adversarial inputs (all-digits, repeated ".", oversized
      segments) still evaluate in under 0.1ms, confirming linear-time
      behavior. Input is also not attacker-reachable over the network: the
      matched string is the first whitespace-split token of local `adb
      devices -l` output (see parseDevices()), not user/network input.
